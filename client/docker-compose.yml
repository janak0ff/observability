networks:
  observability:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:
  # ============================================================
  # NODE EXPORTER
  # Exposes hardware and OS metrics (CPU, RAM, disk, network)
  # Prometheus scrapes this from the server via File SD
  # ============================================================
  node-exporter:
    image: prom/node-exporter:v1.9.0   # pin version for reproducibility
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - observability

  # ============================================================
  # ALLOY
  # Log collection and metrics forwarding agent:
  #   - Reads /var/log/* and forwards to Loki
  #   - Reads Docker container logs and forwards to Loki
  #   - Scrapes Docker daemon metrics and remote-writes to Prometheus
  # Expose port ${ALLOY_PORT} for Prometheus to scrape Alloy's own metrics
  # ============================================================
  alloy:
    image: grafana/alloy:v1.7.4   # pin version for reproducibility
    container_name: alloy
    restart: unless-stopped
    user: root                    # required to read /var/log and Docker socket
    volumes:
      - ./configs/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - observability
    environment:
      - LOKI_URL=${LOKI_URL:-http://server:3100/loki/api/v1/push}
      # NODE_HOSTNAME is used instead of HOSTNAME to avoid conflict with the
      # reserved $HOSTNAME shell variable which Docker Compose reads from the host
      - NODE_HOSTNAME=${NODE_HOSTNAME:-client}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://server:9090/api/v1/write}

  # ============================================================
  # PROCESS EXPORTER
  # Exposes per-process CPU, memory, and file descriptor metrics
  # Config: configs/process-exporter/process.yml
  # ============================================================
  process-exporter:
    image: ncabatoff/process-exporter:0.8.5   # pin version for reproducibility
    container_name: process-exporter
    restart: unless-stopped
    volumes:
      - ./configs/process-exporter/process.yml:/config/process.yml
      - /proc:/host/proc:ro
    command:
      - '-procfs=/host/proc'
      - '-config.path=/config/process.yml'
    ports:
      - "${PROCESS_EXPORTER_PORT:-9256}:9256"
    networks:
      - observability

