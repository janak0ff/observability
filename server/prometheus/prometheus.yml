global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'observability-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/alert-rules.yml'
  - '/etc/prometheus/rules/record-rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scheme: http

  # Grafana self-monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Loki self-monitoring
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Alertmanager self-monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Node Exporter - Client nodes
  - job_name: 'node_exporter'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - host.docker.internal:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
        replacement: '${1}'
      - source_labels: [__address__]
        regex: '.*'
        target_label: node
        replacement: 'client'

  # Alloy for logs
  - job_name: 'alloy_clients'
    static_configs:
      - targets: ['host.docker.internal:12345']
    metrics_path: /metrics

  # Process Exporter
  - job_name: 'process_exporter'
    static_configs:
      - targets: ['host.docker.internal:9256']
