# ============================================================
# Global scrape settings
# Note: duration fields (scrape_interval etc.) cannot use ${VAR} syntax.
# String fields in external_labels DO support ${VAR} expansion.
# ============================================================
global:
  scrape_interval: 15s      # how often to scrape targets
  scrape_timeout: 10s       # how long before a scrape times out
  evaluation_interval: 15s  # how often to evaluate alert rules
  external_labels:
    # Identifies which Prometheus instance sent an alert/metric
    monitor:     'observability-stack'
    # Reads ENVIRONMENT from docker-compose environment block
    # Note: Prometheus only supports ${VAR} bare syntax, not ${VAR:-default}
    environment: '${ENVIRONMENT}'
    host:        'server'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

rule_files:
  - '/etc/prometheus/rules/alert-rules.yml'

scrape_configs:



  # ===========================================================
  # 2. FILE-BASED SERVICE DISCOVERY — Client Nodes
  #
  #    All client targets live in a single file:
  #      prometheus/targets/clients.json
  #
  #    Prometheus hot-reloads this file every 30 seconds.
  #    Manage nodes automatically using:
  #      ./scripts/add-node.sh <IP> <hostname>
  #      ./scripts/remove-node.sh <hostname>
  #
  #    File format (1 block per host, all 3 ports):
  #    [
  #      {
  #        "targets": ["10.0.1.10:9100", "10.0.1.10:12345", "10.0.1.10:9256"],
  #        "labels": { "host": "web-01", "environment": "production" }
  #      }
  #    ]
  # ===========================================================
  # ===========================================================
  # 2. FILE-BASED SERVICE DISCOVERY — Client Nodes
  #
  #    All client targets live in a single file:
  #      prometheus/targets/clients.json
  #
  #    To add a node:    ./scripts/add-node.sh <IP> <hostname>
  #    To remove a node: ./scripts/remove-node.sh <hostname>
  #    To list nodes:    jq '.[].labels' prometheus/targets/clients.json
  #
  #    Prometheus hot-reloads this file every 30 seconds —
  #    no restart needed when adding or removing nodes.
  #
  #    File format (all exporters for one node in one file):
  #    [
  #      {"targets":["10.0.1.10:9100"], "labels":{"job":"node_exporter",   "host":"web-01","environment":"production"}},
  #      {"targets":["10.0.1.10:12345"],"labels":{"job":"alloy",           "host":"web-01","environment":"production"}},
  #      {"targets":["10.0.1.10:9256"], "labels":{"job":"process_exporter","host":"web-01","environment":"production"}}
  #    ]
  # ===========================================================
  - job_name: 'file-sd-clients'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/*.json'   # wildcard — picks up any new *.json file automatically
        refresh_interval: 30s
    relabel_configs:
      # Derive the job label from the port number.
      # This lets clients.json use one block per host (all 3 ports together)
      # without needing to hardcode the job in each entry.
      - source_labels: [__address__]
        regex: '.+:9100'
        target_label: job
        replacement: 'node_exporter'
      - source_labels: [__address__]
        regex: '.+:12345'
        target_label: job
        replacement: 'alloy'
      - source_labels: [__address__]
        regex: '.+:9256'
        target_label: job
        replacement: 'process_exporter'
      - source_labels: [__address__]
        regex: '.+:9338'
        target_label: job
        replacement: 'cadvisor'
      - source_labels: [__address__]
        regex: '.+:9113'
        target_label: job
        replacement: 'nginx'
      - source_labels: [__address__]
        regex: '.+:8080'
        target_label: job
        replacement: 'jenkins'

      # Jenkins Prometheus Plugin exposes metrics at /prometheus, not /metrics
      - source_labels: [__address__]
        regex: '.+:8080'
        target_label: __metrics_path__
        replacement: '/prometheus'

      # Strip port from instance label so Grafana shows just the IP
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
        replacement: '$1'

      # Fix the server's own node_exporter instance label:
      # host.docker.internal is a Docker alias; normalise to 'server' for dashboards
      - source_labels: [__address__]
        regex: 'host\.docker\.internal:9100'
        target_label: instance
        replacement: 'server'




  # ===========================================================
  # 4. AWS EC2 SERVICE DISCOVERY (disabled by default)
  #    Uncomment these jobs ONLY if you have AWS EC2 SD credentials
  #    set in .env: AWS_EC2_SD_ACCESS_KEY_ID, AWS_EC2_SD_SECRET_ACCESS_KEY,
  #    AWS_EC2_SD_REGION
  #
  #    To opt an EC2 instance IN to scraping, add these tags:
  #      Scrape      = true
  #      ScrapePort  = 9100
  #      Job         = node_exporter
  #      Environment = production
  #      Name        = web-01
  # ===========================================================
  - job_name: 'ec2-sd-node-exporter'
    ec2_sd_configs:
      - region: us-east-1
        port: 9100
        refresh_interval: 60s
        filters:
          - name: tag:Scrape
            values: ['true']
          - name: instance-state-name
            values: ['running']
    relabel_configs:
      # Use public IP — Monitor server is outside the VPC
      - source_labels: [__meta_ec2_public_ip]
        regex: '(.+)'
        replacement: '$1:9100'
        target_label: __address__
      # Use the Name tag as the instance label (friendly name in Grafana)
      - source_labels: [__meta_ec2_tag_Name]
        regex: '(.+)'
        target_label: instance
      - source_labels: [__meta_ec2_region]
        target_label: region
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
      - source_labels: [__meta_ec2_instance_type]
        target_label: instance_type
      - source_labels: [__meta_ec2_instance_id]
        target_label: ec2_instance_id
      - source_labels: [__meta_ec2_tag_Job]
        regex: '(.+)'
        target_label: job
      - target_label: job
        replacement: 'node_exporter'
      - source_labels: [__meta_ec2_tag_Environment]
        regex: '(.+)'
        target_label: environment

  - job_name: 'ec2-sd-alloy'
    ec2_sd_configs:
      - region: us-east-1
        port: 12345
        refresh_interval: 60s
        filters:
          - name: tag:Scrape
            values: ['true']
          - name: tag:Job
            values: ['alloy']
          - name: instance-state-name
            values: ['running']
    relabel_configs:
      # Use public IP — Monitor server is outside the VPC
      - source_labels: [__meta_ec2_public_ip]
        regex: '(.*)'
        replacement: '$1:12345'
        target_label: __address__
      # Use the Name tag as the instance label (friendly name in Grafana)
      - source_labels: [__meta_ec2_tag_Name]
        regex: '(.+)'
        target_label: instance
      - source_labels: [__meta_ec2_region]
        target_label: region
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
      - source_labels: [__meta_ec2_instance_type]
        target_label: instance_type
      - source_labels: [__meta_ec2_instance_id]
        target_label: ec2_instance_id
      - target_label: job
        replacement: 'alloy'
      - source_labels: [__meta_ec2_tag_Environment]
        regex: '(.+)'
        target_label: environment
