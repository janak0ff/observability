# ============================================================
# Global scrape settings — all values read from .env via
# --config.expand-env=true (set in docker-compose.yml)
# ============================================================
global:
  scrape_interval: ${SCRAPE_INTERVAL:-15s}
  scrape_timeout: ${SCRAPE_TIMEOUT:-10s}
  evaluation_interval: ${SCRAPE_INTERVAL:-15s}
  external_labels:
    # Identifies which Prometheus instance sent an alert/metric
    monitor:     'observability-stack'
    # Reflects the ENVIRONMENT value set in your .env file
    environment: '${ENVIRONMENT:-development}'
    host:        'server'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

rule_files:
  - '/etc/prometheus/rules/alert-rules.yml'

scrape_configs:

  # ===========================================================
  # 1. DOCKER SERVICE DISCOVERY
  #    Auto-discovers all containers in the Docker network.
  #    A container is scraped only if it has the label:
  #      prometheus.io/scrape: "true"
  #    Optional container labels:
  #      prometheus.io/port: "8080"   (default: first exposed port)
  #      prometheus.io/path: "/metrics" (default: /metrics)
  # ===========================================================
  - job_name: 'docker-sd'
    docker_sd_configs:
      - host: http://docker-socket-proxy:2375
        refresh_interval: 30s

    relabel_configs:
      # Drop containers that don't have prometheus.io/scrape=true
      - source_labels: [__meta_docker_container_label_prometheus_io_scrape]
        action: keep
        regex: 'true'

      # Use custom port if prometheus.io/port label is set
      - source_labels: [__address__, __meta_docker_container_label_prometheus_io_port]
        action: replace
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: '$1:$2'
        target_label: __address__

      # Use custom metrics path if prometheus.io/path label is set
      - source_labels: [__meta_docker_container_label_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: '(.+)'

      # Set job label from container name
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: job

      # Set instance label from container name
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance

      # Carry the container image as a label
      - source_labels: [__meta_docker_container_image]
        target_label: image

  # ===========================================================
  # 2. FILE-BASED SERVICE DISCOVERY — Client Nodes
  #    Scrape targets are defined in JSON files under
  #    /etc/prometheus/targets/*.json.
  #    Prometheus reloads these files every 30s automatically —
  #    add/remove nodes with zero Prometheus restart.
  #
  #    File format example (targets/node_exporter.json):
  #    [
  #      {
  #        "targets": ["10.0.1.10:9100"],
  #        "labels": { "job": "node_exporter", "host": "web-01", "env": "production" }
  #      }
  #    ]
  # ===========================================================
  # ===========================================================
  # 2. FILE-BASED SERVICE DISCOVERY — Client Nodes
  #
  #    All client targets live in a single file:
  #      prometheus/targets/clients.json
  #
  #    To add a node:    ./scripts/add-node.sh <IP> <hostname>
  #    To remove a node: ./scripts/remove-node.sh <hostname>
  #    To list nodes:    jq '.[].labels' prometheus/targets/clients.json
  #
  #    Prometheus hot-reloads this file every 30 seconds —
  #    no restart needed when adding or removing nodes.
  #
  #    File format (all exporters for one node in one file):
  #    [
  #      {"targets":["10.0.1.10:9100"], "labels":{"job":"node_exporter",   "host":"web-01","environment":"production"}},
  #      {"targets":["10.0.1.10:12345"],"labels":{"job":"alloy",           "host":"web-01","environment":"production"}},
  #      {"targets":["10.0.1.10:9256"], "labels":{"job":"process_exporter","host":"web-01","environment":"production"}}
  #    ]
  # ===========================================================
  - job_name: 'file-sd-clients'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/*.json'   # wildcard — picks up any new *.json file automatically
        refresh_interval: 30s
    relabel_configs:
      # Derive the job label from the port number.
      # This lets clients.json use one block per host (all 3 ports together)
      # without needing to hardcode the job in each entry.
      - source_labels: [__address__]
        regex: '.+:9100'
        target_label: job
        replacement: 'node_exporter'
      - source_labels: [__address__]
        regex: '.+:12345'
        target_label: job
        replacement: 'alloy'
      - source_labels: [__address__]
        regex: '.+:9256'
        target_label: job
        replacement: 'process_exporter'

      # Strip port from instance label so Grafana shows just the IP
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
        replacement: '$1'


  # ===========================================================
  # 3. AWS EC2 SERVICE DISCOVERY
  #    Automatically discovers EC2 instances in your AWS account.
  #
  #    To opt an instance IN to scraping, add these EC2 tags:
  #      Scrape      = true
  #      ScrapePort  = 9100       (optional, defaults to job port)
  #      Job         = node_exporter (optional, for grouping)
  #      Environment = production (optional label)
  #      Name        = web-01     (used as instance label)
  #
  #    Required IAM permission: ec2:DescribeInstances
  #    Set credentials in .env:
  #      AWS_EC2_SD_ACCESS_KEY_ID / AWS_EC2_SD_SECRET_ACCESS_KEY
  #    OR attach an IAM instance role to the Prometheus server.
  # ===========================================================
  - job_name: 'ec2-sd-node-exporter'
    ec2_sd_configs:
        # AWS region — set AWS_EC2_SD_REGION in .env, default us-east-1
      - region: ${AWS_EC2_SD_REGION:-us-east-1}
        access_key: ${AWS_EC2_SD_ACCESS_KEY_ID}
        secret_key: ${AWS_EC2_SD_SECRET_ACCESS_KEY}
        port: 9100
        refresh_interval: 60s
        filters:
          - name: tag:Scrape
            values: ['true']
          - name: instance-state-name
            values: ['running']

    relabel_configs:
      # Build scrape address: use ScrapePort tag if present, else default 9100
      - source_labels: [__meta_ec2_private_ip, __meta_ec2_tag_ScrapePort]
        regex: '(.+);(\d+)'
        replacement: '$1:$2'
        target_label: __address__
      - source_labels: [__meta_ec2_private_ip]
        regex: '(.+)'
        replacement: '$1:9100'
        target_label: __address__

      # instance = Name tag if set, otherwise private IP
      - source_labels: [__meta_ec2_tag_Name]
        regex: '(.+)'
        target_label: instance
      - source_labels: [__meta_ec2_private_ip]
        target_label: instance

      # Useful EC2 metadata as labels
      - source_labels: [__meta_ec2_region]
        target_label: region
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
      - source_labels: [__meta_ec2_instance_type]
        target_label: instance_type
      - source_labels: [__meta_ec2_instance_id]
        target_label: ec2_instance_id

      # Job: prefer EC2 Job tag, else default
      - source_labels: [__meta_ec2_tag_Job]
        regex: '(.+)'
        target_label: job
      - target_label: job
        replacement: 'node_exporter'

      # Environment: prefer EC2 Environment tag
      - source_labels: [__meta_ec2_tag_Environment]
        regex: '(.+)'
        target_label: environment

  # EC2 SD for Alloy (log shipper) — tag: Job=alloy AND Scrape=true
  - job_name: 'ec2-sd-alloy'
    ec2_sd_configs:
        # Same region as above — controlled by AWS_EC2_SD_REGION in .env
      - region: ${AWS_EC2_SD_REGION:-us-east-1}
        access_key: ${AWS_EC2_SD_ACCESS_KEY_ID}
        secret_key: ${AWS_EC2_SD_SECRET_ACCESS_KEY}
        port: 12345
        refresh_interval: 60s
        filters:
          - name: tag:Scrape
            values: ['true']
          - name: tag:Job
            values: ['alloy']
          - name: instance-state-name
            values: ['running']

    relabel_configs:
      - source_labels: [__meta_ec2_private_ip]
        regex: '(.*)'
        replacement: '$1:12345'
        target_label: __address__
      - source_labels: [__meta_ec2_tag_Name]
        regex: '(.+)'
        target_label: instance
      - source_labels: [__meta_ec2_private_ip]
        target_label: instance
      - source_labels: [__meta_ec2_region]
        target_label: region
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
      - source_labels: [__meta_ec2_instance_type]
        target_label: instance_type
      - source_labels: [__meta_ec2_instance_id]
        target_label: ec2_instance_id
      - target_label: job
        replacement: 'alloy'
      - source_labels: [__meta_ec2_tag_Environment]
        regex: '(.+)'
        target_label: environment
