global:
  scrape_interval: 30s          # Production: scrape every 30s (less load than 15s)
  scrape_timeout: 10s           # Fail fast on unreachable targets
  evaluation_interval: 30s
  external_labels:
    monitor: 'observability-prod'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

rule_files:
  - '/etc/prometheus/rules/alert-rules.yml'
  - '/etc/prometheus/rules/record-rules.yml'

scrape_configs:
  # ----------------------------------------
  # Observability stack self-monitoring
  # ----------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # ----------------------------------------
  # Node Exporter — Production cloud servers
  # Each server must have node_exporter running on port 9100.
  # Add server IPs in .env as CLIENT_NODE_1, CLIENT_NODE_2, etc.
  # ----------------------------------------
  - job_name: 'node_exporter'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - '${CLIENT_NODE_1}'
          - '${CLIENT_NODE_2}'
          # Add more nodes via .env:
          # - '${CLIENT_NODE_3}'
    relabel_configs:
      # Use only hostname (strip :9100) as the instance label
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
        replacement: '${1}'

  # ----------------------------------------
  # Alloy (log shipping agent) self-monitoring
  # ----------------------------------------
  - job_name: 'alloy'
    static_configs:
      - targets:
          - '${CLIENT_NODE_1_ALLOY:-localhost:12345}'
