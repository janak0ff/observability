auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# ============================================================
# SCHEMA CONFIG (same for both storage backends)
# ============================================================
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: ${LOKI_STORAGE_TYPE:-filesystem}  # "filesystem" or "s3"
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

# ============================================================
# STORAGE CONFIG
# Set LOKI_STORAGE_TYPE=filesystem in .env for local storage
# Set LOKI_STORAGE_TYPE=s3 in .env for AWS S3 storage
# ============================================================
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h

  # --- LOCAL FILESYSTEM (active when LOKI_STORAGE_TYPE=filesystem) ---
  filesystem:
    directory: /loki/chunks

  # --- AWS S3 (active when LOKI_STORAGE_TYPE=s3) ---
  aws:
    region: ${AWS_REGION:-us-east-1}
    bucketnames: ${LOKI_BUCKET_NAME:-loki-logs}
    access_key_id: ${AWS_ACCESS_KEY_ID:-}
    secret_access_key: ${AWS_SECRET_ACCESS_KEY:-}
    # Required for AWS Academy / temporary STS credentials
    session_token: ${AWS_SESSION_TOKEN:-}
    s3forcepathstyle: false
    insecure: false
    http_config:
      idle_conn_timeout: 90s
      response_header_timeout: 0s

# ============================================================
# COMPACTOR
# ============================================================
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  # Must match LOKI_STORAGE_TYPE
  delete_request_store: ${LOKI_STORAGE_TYPE:-filesystem}

# ============================================================
# INGESTION LIMITS
# ============================================================
limits_config:
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 1h    # Production: reject truly stale logs
  creation_grace_period: 10m
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_parallelism: 32
  max_streams_per_user: 10000
  max_global_streams_per_user: 10000
  max_chunks_per_query: 2000000
  max_query_series: 1000
  cardinality_limit: 100000
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  retention_period: ${LOKI_RETENTION_PERIOD:-720h}

# ============================================================
# INGESTER
# ============================================================
ingester:
  max_chunk_age: 2h
  chunk_idle_period: 30m
  chunk_target_size: 1536000

# ============================================================
# QUERY PERFORMANCE
# ============================================================
query_range:
  max_retries: 5

frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

# ============================================================
# RULER (Loki alert rules)
# ============================================================
ruler:
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  rule_path: /loki/rules-temp
  poll_interval: 1m
  evaluation_interval: 1m

  # Storage for ruler rules — local or S3
  storage:
    type: local
    local:
      directory: /etc/loki/rules