groups:
  - name: error_log_alerts
    interval: 1m
    rules:
      # Alert when any job has 5+ error lines in the last 5 minutes
      - alert: ErrorLogsDetected
        expr: |
          sum by (job, app, host) (
            count_over_time({job=~".+"} |= "error" [5m])
          ) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Error logs detected for {{ $labels.job }}"
          description: "More than 5 error log lines detected in the last 5 minutes for job={{ $labels.job }} on host={{ $labels.host }}."

      # Alert on high error rate - more than 100 errors in 5 mins (critical)
      - alert: HighErrorLogRate
        expr: |
          sum by (job, app, host) (
            count_over_time({job=~".+"} |= "error" [5m])
          ) > 100
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "High error log rate for {{ $labels.job }}"
          description: "More than 100 error log lines in the last 5 minutes for job={{ $labels.job }} on host={{ $labels.host }}. Immediate attention required."

      # Alert on container crash/fatal logs
      - alert: FatalLogsDetected
        expr: |
          sum by (job, container, host) (
            count_over_time({job=~".+"} |~ "(?i)(fatal|panic|FATAL|PANIC)" [5m])
          ) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "FATAL/PANIC logs detected for {{ $labels.job }}"
          description: "Fatal or panic log entries detected in the last 5 minutes for job={{ $labels.job }} on {{ $labels.host }}."
