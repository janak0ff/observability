global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'janak.shrestha.it@gmail.com'
  smtp_auth_username: 'janak.shrestha.it@gmail.com'
  # Use a Gmail App Password (not your regular password)
  # Generate at: https://myaccount.google.com/apppasswords
  smtp_auth_password: 'wadyhxqqaiykbkav'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-alerts'

  routes:
    - match:
        severity: critical
      receiver: 'email-alerts'
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'email-alerts'
      group_wait: 1m
      repeat_interval: 4h

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'janak123g@gmail.com'
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} - {{ .CommonAnnotations.summary }}'
        html: '{{ template "email.custom.html" . }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']