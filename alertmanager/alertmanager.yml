global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'

  # Route critical alerts separately if you add a real receiver later
  routes:
    - match:
        severity: critical
      receiver: 'null'
      continue: true

receivers:
  # Null receiver — silently accepts alerts (useful for local dev)
  # Replace with a real receiver (Slack, email, PagerDuty) for production
  - name: 'null'

  # ── Slack example (uncomment and fill in to use) ──────────────────────────
  # - name: 'slack'
  #   slack_configs:
  #     - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
  #       channel: '#alerts'
  #       title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
  #       text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  #       send_resolved: true

  # ── Email example (uncomment and fill in to use) ──────────────────────────
  # - name: 'email'
  #   email_configs:
  #     - to: 'you@example.com'
  #       from: 'alerts@example.com'
  #       smarthost: 'smtp.example.com:587'
  #       auth_username: 'alerts@example.com'
  #       auth_password: 'your-password'
  #       send_resolved: true

inhibit_rules:
  # Suppress warnings if a critical alert is already firing for the same instance
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
